[package]
name = "code-map"
version = "0.1.0"
edition = "2021"
default-run = "code-map"

[dependencies]
makepad-widgets = { path = "../makepad/widgets" }
fluent-bundle = "0.15"
unic-langid = "0.9"

# Makepad replaces a few crates.io crates with its own copies. Its workspace
# does this in its root Cargo.toml, so we repeat it here for our own crate.
[patch.crates-io]
bitflags = { path = "../makepad/libs/bitflags" }
smallvec = { path = "../makepad/libs/smallvec" }
windows-link = { path = "../makepad/libs/windows/windows-link" }

# An empty workspace table: this crate is its own project, not part of Makepad's.
[workspace]
